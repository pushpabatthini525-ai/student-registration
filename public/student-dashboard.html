<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>My Registration</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.qrbox{display:flex;justify-content:center;margin:14px 0}
#slip{display:none}
@media print{
  nav,.noPrint{display:none!important}
  body *{visibility:hidden}
  #slip,#slip *{visibility:visible}
  #slip{display:block!important;position:absolute;top:0;left:0;width:100%;padding:20px}
  .slip-card{border:2px solid #1f6f5c;border-radius:10px;padding:24px;max-width:500px;margin:0 auto}
  .slip-head{text-align:center;border-bottom:2px solid #1f6f5c;padding-bottom:12px;margin-bottom:16px}
  .slip-head h2{margin:0;color:#1f6f5c}
  .slip-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ccc;font-size:.92rem}
  .slip-qr{display:flex;justify-content:center;margin:16px 0}
}
</style>
</head><body>
<nav><a href="home.html">Home</a><span class="navtxt">My Registration</span><a href="#" id="logout">Logout</a></nav>
<div class="wrap"><div class="card" id="card">Loading...</div></div>

<div id="slip">
  <div class="slip-card">
    <div class="slip-head"><h2>Registration Slip</h2><div>Student Registration Portal</div></div>
    <div class="slip-qr" id="slipQr"></div>
    <div class="slip-row"><span>Name</span><b id="slipName"></b></div>
    <div class="slip-row"><span>Registration No</span><b id="slipRegNo"></b></div>
    <div class="slip-row"><span>Status</span><b id="slipStatus"></b></div>
  </div>
</div>

<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=iso=>new Date(iso).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'});

fetch('/api/student/me').then(async r=>{
  if(r.status===401){location.href='student-login.html';return;}
  const d=await r.json();
  document.getElementById('card').innerHTML=
    '<div class="status-hero"><div style="font-size:1.1rem;font-weight:700">'+esc(d.full_name)+'</div>'+
    '<span class="badge '+d.status+'">'+d.status+'</span>'+
    (d.status==='Rejected'&&d.reject_reason?'<p class="rs" style="margin:10px auto 0;max-width:320px">Reason: '+esc(d.reject_reason)+'</p>':'')+
    '</div>'+
    '<div class="row"><span>Registration Number</span><b>'+esc(d.reg_no)+'</b></div>'+
    '<div class="row"><span>Email</span><b>'+esc(d.email)+'</b></div>'+
    '<div class="row"><span>Current Place</span><b>'+esc(d.current_place)+'</b></div>'+
    '<div class="row"><span>Registered On</span><b>'+fmt(d.registered_at)+'</b></div>'+
    '<button class="btn noPrint" id="printBtn" style="margin-top:16px">🖨 Download / Print Slip</button>';

  document.getElementById('slipName').textContent=d.full_name;
  document.getElementById('slipRegNo').textContent=d.reg_no;
  document.getElementById('slipStatus').textContent=d.status;
  new QRCode(document.getElementById('slipQr'), { text: d.reg_no, width: 130, height: 130 });

  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
}).catch(()=>{document.getElementById('card').textContent='Could not load your details.';});

document.getElementById('logout').addEventListener('click',async e=>{
  e.preventDefault();
  await fetch('/api/student/logout',{method:'POST'});
  location.href='student-login.html';
});
</script></body></html>
