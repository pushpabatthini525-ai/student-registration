<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="style.css"></head><body>
<nav><a href="home.html">Home</a><a href="index.html">Register</a><a href="student-login.html">Student Login</a></nav>
<div class="wrap"><h1>Forgot Password</h1>
<div class="card">
<div class="banner" id="banner"></div>
<div class="info" id="info"></div>
<form id="f">
<div class="field"><label>Registered Email</label><input id="email" type="email" placeholder="you@example.com"></div>
<button class="btn" id="btn">Send Reset Link</button>
</form>
<a class="link" href="student-login.html">Back to Login</a>
</div></div>
<script>
const $=id=>document.getElementById(id);
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  $('banner').classList.remove('show');$('info').classList.remove('show');
  const v=$('email').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){$('banner').textContent='Enter a valid email.';$('banner').classList.add('show');return;}
  $('btn').disabled=true;$('btn').textContent='Sending...';
  try{
    const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v})});
    const d=await r.json();
    $('info').textContent=d.message;$('info').classList.add('show');
    $('f').reset();
  }catch(_){$('banner').textContent='Cannot reach server.';$('banner').classList.add('show');}
  $('btn').disabled=false;$('btn').textContent='Send Reset Link';
});
</script></body></html>
