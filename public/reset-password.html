<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<link rel="stylesheet" href="style.css"></head><body>
<nav><a href="home.html">Home</a><a href="index.html">Register</a><a href="student-login.html">Student Login</a></nav>
<div class="wrap"><h1>Reset Password</h1>
<div class="card">
<div class="banner" id="banner"></div>
<div class="info" id="info"></div>
<form id="f">
<div class="field"><label>New Password (min 6 characters)</label><input id="p1" type="password"></div>
<div class="field"><label>Confirm New Password</label><input id="p2" type="password"></div>
<button class="btn" id="btn">Reset Password</button>
</form>
</div></div>
<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const id=params.get('id'), token=params.get('token');
if(!id||!token){$('f').style.display='none';$('banner').textContent='Invalid or missing reset link.';$('banner').classList.add('show');}

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  $('banner').classList.remove('show');$('info').classList.remove('show');
  if($('p1').value.length<6){$('banner').textContent='Password must be at least 6 characters.';$('banner').classList.add('show');return;}
  if($('p1').value!==$('p2').value){$('banner').textContent='Passwords do not match.';$('banner').classList.add('show');return;}
  $('btn').disabled=true;$('btn').textContent='Saving...';
  try{
    const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,token,newPassword:$('p1').value})});
    const d=await r.json();
    if(r.ok){
      $('info').textContent='Password reset successfully. You can now log in.';$('info').classList.add('show');
      $('f').style.display='none';
      setTimeout(()=>location.href='student-login.html',2000);
    }else{$('banner').textContent=d.error;$('banner').classList.add('show');}
  }catch(_){$('banner').textContent='Cannot reach server.';$('banner').classList.add('show');}
  $('btn').disabled=false;$('btn').textContent='Reset Password';
});
</script></body></html>
